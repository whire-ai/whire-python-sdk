[project]
name = "whire"
version = "0.1.0"
description = "Python SDK for the Whire Payments API — built for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Whire"}]
keywords = ["payments", "ai", "agents", "sdk", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0,<3.0",
]

[project.urls]
Homepage = "https://whire.ai"
Documentation = "https://docs.whire.ai"
Repository = "https://github.com/whire-ai/whire-python-sdk"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whire"]

[tool.hatch.build.targets.sdist]
include = [
    "whire",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
